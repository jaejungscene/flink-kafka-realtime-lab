apiVersion: apps/v1
kind: Deployment
metadata:
  name: realtime-lab-api
  namespace: realtime-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: realtime-lab-api
  template:
    metadata:
      labels:
        app: realtime-lab-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: realtime-lab-api:1.0.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: realtime-lab-config
          env:
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: realtime-lab-api-secrets
                  key: api-token
                  optional: false
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 4
---
apiVersion: v1
kind: Service
metadata:
  name: realtime-lab-api
  namespace: realtime-lab
spec:
  selector:
    app: realtime-lab-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
