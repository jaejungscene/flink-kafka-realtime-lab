apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: realtime-lab-flink
  namespace: realtime-lab
spec:
  image: realtime-lab-flink-job:2.1.2
  flinkVersion: v2_1
  flinkConfiguration:
    taskmanager.numberOfTaskSlots: "4"
    state.backend.type: hashmap
    execution.checkpointing.interval: "10000"
    execution.checkpointing.mode: AT_LEAST_ONCE
    execution.checkpointing.timeout: 2 min
    execution.checkpointing.min-pause: 5 s
    execution.checkpointing.max-concurrent-checkpoints: "1"
    execution.checkpointing.tolerable-failed-checkpoints: "3"
    execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
    restart-strategy.type: fixed-delay
    restart-strategy.fixed-delay.attempts: "3"
    restart-strategy.fixed-delay.delay: 10 s
    metrics.reporters: prom
    metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
    metrics.reporter.prom.port: "9249"
  serviceAccount: flink
  podTemplate:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9249"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 9999
        runAsGroup: 9999
        fsGroup: 9999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: flink-main-container
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
  jobManager:
    resource:
      memory: "1024m"
      cpu: 0.5
  taskManager:
    replicas: 1
    resource:
      memory: "2048m"
      cpu: 1
  job:
    jarURI: local:///opt/flink/usrlib/realtime-lab-flink-job.jar
    entryClass: io.github.jaejungscene.realtimelab.job.RealTimeAlertJob
    parallelism: 2
    upgradeMode: stateless
    args:
      - --bootstrapServers
      - realtime-lab-kafka-kafka-bootstrap:9092
      - --rawTopic
      - transactions.raw
      - --replayTopic
      - transactions.replay
      - --merchantRiskProfileTopic
      - merchant_risk_profiles
      - --alertTopic
      - alerts.fraud
      - --aggregateTopic
      - transactions.aggregates
      - --dlqTopic
      - transactions.dlq
      - --consumerGroup
      - flink-realtime-lab
      - --sourceIsolationLevel
      - read_uncommitted
      - --sinkDeliveryGuarantee
      - AT_LEAST_ONCE
      - --checkpointIntervalMillis
      - "10000"
      - --watermarkDelaySeconds
      - "10"
      - --allowedLatenessSeconds
      - "30"
      - --sourceIdleTimeoutSeconds
      - "30"
      - --maxFutureSkewSeconds
      - "300"
      - --deduplicationTtlHours
      - "24"
      - --sourceStartupMode
      - LATEST
      - --transactionalIdPrefix
      - realtime-lab-k8s
      - --riskHighFraudScore
      - "0.92"
      - --riskHighAmount
      - "1000.0"
      - --riskHighIpRisk
      - "80"
      - --riskBurstCountThreshold
      - "5"
      - --riskBurstAmountThreshold
      - "3000.0"
      - --riskMerchantCountThreshold
      - "25"
      - --riskMerchantAmountThreshold
      - "15000.0"
      - --riskMerchantAvgFraudScoreThreshold
      - "0.72"
