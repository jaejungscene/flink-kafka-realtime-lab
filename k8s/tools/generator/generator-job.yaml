apiVersion: batch/v1
kind: Job
metadata:
  name: realtime-lab-generator
  namespace: realtime-lab
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: realtime-lab-generator
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: generator
          image: realtime-lab-generator:1.0.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: realtime-lab-config
          env:
            - name: EVENTS_PER_SECOND
              value: "15"
            - name: RUN_SECONDS
              value: "60"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
