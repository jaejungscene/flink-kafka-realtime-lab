groups:
  - name: realtime-lab
    rules:
      - alert: RealtimeLabKafkaMetricsUnavailable
        expr: realtime_lab_kafka_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Realtime Lab API cannot collect Kafka metrics

      - alert: RealtimeLabConsumerLagHigh
        expr: sum by (group, topic) (realtime_lab_kafka_consumer_lag) > 200
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Flink consumer lag is above the lab threshold
          description: "{{ $labels.group }} / {{ $labels.topic }} lag is {{ $value }}"

      - alert: RealtimeLabMetricPartitionErrors
        expr: realtime_lab_metrics_partition_errors > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: One or more Kafka partition offsets could not be collected
