groups:
  - name: realtime-lab
    rules:
      - alert: RealtimeLabApiMetricsDown
        expr: up{job="realtime-lab-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Realtime Lab API metrics endpoint is unreachable

      - alert: RealtimeLabKafkaMetricsUnavailable
        expr: realtime_lab_kafka_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Realtime Lab API cannot collect Kafka metrics

      - alert: RealtimeLabFlinkMetricsDown
        expr: up{job=~"flink-(jobmanager|taskmanager)"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Flink runtime metrics endpoint is unreachable
          description: "{{ $labels.job }} target {{ $labels.instance }} is down"

      - alert: RealtimeLabConsumerLagHigh
        expr: sum by (group, topic) (realtime_lab_kafka_consumer_lag) > 200
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Flink consumer lag is above the lab threshold
          description: "{{ $labels.group }} / {{ $labels.topic }} lag is {{ $value }}"

      - alert: RealtimeLabKafkaTopicUnavailable
        expr: realtime_lab_kafka_topic_available == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: A configured Realtime Lab Kafka topic is unavailable
          description: "{{ $labels.topic }} is missing or returned a metadata error"

      - alert: RealtimeLabMetricPartitionErrors
        expr: realtime_lab_metrics_partition_errors > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: One or more Kafka partition offsets could not be collected

      - alert: RealtimeLabConsumerGroupOffsetCollectionErrors
        expr: realtime_lab_metrics_group_offset_errors > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Kafka consumer group offsets could not be collected

      - alert: RealtimeLabKafkaMetricsStale
        expr: time() - realtime_lab_metrics_last_success_timestamp_seconds > 60
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Kafka metric collection has not succeeded recently
          description: "Last successful collection was {{ $value | humanizeDuration }} ago"

      - alert: RealtimeLabKafkaMetricsCollectionSlow
        expr: realtime_lab_metrics_collection_duration_seconds > 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Kafka metric collection is slower than the lab threshold
