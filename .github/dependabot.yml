version: 2
updates:
  - package-ecosystem: maven
    directory: /flink-job
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    labels: [dependencies, java]

  - package-ecosystem: pip
    directory: /api
    schedule:
      interval: weekly
      day: monday
      time: "09:10"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    labels: [dependencies, python]

  - package-ecosystem: pip
    directory: /generator
    schedule:
