  - package-ecosystem: docker
    directory: /flink-job
    schedule:
      interval: weekly
      day: monday
      time: "09:48"
      timezone: Asia/Seoul
    open-pull-requests-limit: 3
    labels: [dependencies, docker]

  - package-ecosystem: github-actions
