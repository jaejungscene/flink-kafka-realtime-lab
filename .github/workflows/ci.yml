name: ci

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flink-job-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test Flink job
        working-directory: flink-job
        run: mvn -B -ntp verify

  docker-compose-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config
      - name: Validate compose file with optional profiles
        run: docker compose --profile schema --profile cdc --profile observability config
      - name: Validate Prometheus config and rules
        run: >-
          docker run --rm --entrypoint promtool
          -v "$PWD/observability/prometheus:/etc/prometheus:ro"
          prom/prometheus:v3.5.0
          check config /etc/prometheus/prometheus.yml

  python-and-k8s-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-test.txt
      - uses: azure/setup-kubectl@v4
      - name: Install API test dependencies
        run: python -m pip install -r api/requirements-test.txt
      - name: Compile Python tools
        run: python3 -m py_compile api/src/main.py cdc/register_postgres_connector.py common/python/realtime_lab/dlq_tools.py generator/src/producer.py replayer/src/replay_dlq.py scripts/register_schemas.py scripts/replay-dlq-api.py
      - name: Test API DLQ helpers
        run: PYTHONPATH=api:common/python python3 -m unittest discover -s api/tests
      - name: Lint Python sources
        run: ruff check api cdc common generator replayer scripts/*.py
      - name: Validate JSON schema and dashboard files
        run: |
          python3 - <<'PY'
          import json
          import pathlib

          paths = list(pathlib.Path("schemas").glob("*.avsc"))
          paths += [
              pathlib.Path("cdc/postgres-source-connector.json"),
              pathlib.Path("observability/grafana/dashboards/realtime-lab.json"),
          ]
          for path in paths:
              value = json.loads(path.read_text())
              print(f"json ok: {path}")
              if path.name == "postgres-source-connector.json":
                  assert "connector.class" in value
                  assert "name" not in value and "config" not in value
          PY
      - name: Validate shell scripts
        run: |
          bash -n flink-job/docker/submit-job.sh scripts/create-topics.sh scripts/chaos-kill-taskmanager.sh scripts/flink-savepoint.sh scripts/smoke-test.sh scripts/ci-e2e-smoke.sh scripts/load-snapshot.sh scripts/run-load-experiment.sh
      - name: Validate Markdown fences
        run: |
          for f in README.md docs/*.md; do
            n=$(grep -n '^```' "$f" | wc -l | tr -d ' ')
            if [ $((n % 2)) -ne 0 ]; then
              echo "unclosed fence: $f ($n)"
              exit 1
            fi
          done
      - name: Render Kubernetes dev overlay
        run: kubectl kustomize k8s/overlays/dev >/tmp/realtime-lab-dev.yaml
      - name: Render Kubernetes prod-like overlay
        run: kubectl kustomize k8s/overlays/prod-like >/tmp/realtime-lab-prod-like.yaml
      - name: Render Kubernetes exactly-once overlay
        run: kubectl kustomize k8s/overlays/exactly-once >/tmp/realtime-lab-exactly-once.yaml

  compose-e2e-smoke:
    name: compose-e2e-smoke (${{ matrix.mode }})
    runs-on: ubuntu-latest
    needs:
      - flink-job-test
      - docker-compose-config
      - python-and-k8s-static
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: at-least-once
            target: ci-smoke
          - mode: exactly-once
            target: ci-smoke-exactly-once
    steps:
      - uses: actions/checkout@v4
      - name: Show Docker versions
        run: |
          docker version
          docker compose version
      - name: Run Docker Compose E2E smoke test
        env:
          CI_GENERATOR_RUN_SECONDS: "80"
          CI_GENERATOR_EVENTS_PER_SECOND: "40"
          SMOKE_TOPIC_ATTEMPTS: "35"
        run: make ${{ matrix.target }}

  cdc-connector-smoke:
    runs-on: ubuntu-latest
    needs:
      - docker-compose-config
      - python-and-k8s-static
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Start CDC services
        run: docker compose --profile cdc up -d kafka topic-init postgres kafka-connect
      - name: Register connector and wait for its task
        run: docker compose --profile cdc run --rm cdc-init
      - name: Verify initial CDC snapshot record
        run: |
          set -o pipefail
          timeout 90s docker compose exec -T kafka \
            /opt/kafka/bin/kafka-console-consumer.sh \
            --bootstrap-server kafka:9092 \
            --topic merchant_risk_profiles \
            --from-beginning \
            --max-messages 1 \
            | python3 -c 'import json,sys; value=json.loads(sys.stdin.readline()); assert value.get("merchant_id")'
      - name: Clean up CDC stack
        if: always()
        run: docker compose --profile cdc down -v --remove-orphans
