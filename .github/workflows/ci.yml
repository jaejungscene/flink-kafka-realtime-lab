name: ci

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flink-job-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test Flink job
        working-directory: flink-job
        run: mvn -B -ntp verify

  docker-compose-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose file
        run: docker compose config
      - name: Validate compose file with optional profiles
        run: docker compose --profile schema --profile cdc --profile observability config
      - name: Validate Prometheus config and rules
        run: >-
          docker run --rm --entrypoint promtool
          -v "$PWD/observability/prometheus:/etc/prometheus:ro"
          prom/prometheus:v3.5.0
          check config /etc/prometheus/prometheus.yml

  python-and-k8s-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-test.txt
      - uses: azure/setup-kubectl@v5
      - name: Install API test dependencies
        run: python -m pip install -r api/requirements-test.txt
      - name: Compile Python tools
        run: python3 -m compileall -q api/src cdc common/python generator/src replayer/src scripts
      - name: Test common Python helpers
        run: PYTHONPATH=common/python python3 -m unittest discover -s common/python/tests
      - name: Test API contracts and DLQ helpers
        run: PYTHONPATH=api:common/python python3 -m unittest discover -s api/tests
      - name: Test CDC connector registrar
        run: python3 -m unittest discover -s cdc/tests
      - name: Test generator delivery behavior
        run: PYTHONPATH=generator python3 -m unittest discover -s generator/tests
      - name: Test replayer settings
        run: PYTHONPATH=replayer:common/python python3 -m unittest discover -s replayer/tests
      - name: Lint Python sources
        run: ruff check api cdc common generator replayer scripts/*.py
      - name: Validate JSON schema and dashboard files
        run: |
          python3 - <<'PY'
          import json
          import pathlib

          paths = list(pathlib.Path("schemas").glob("*.avsc"))
          paths += [
              pathlib.Path("cdc/postgres-source-connector.json"),
              pathlib.Path("observability/grafana/dashboards/realtime-lab.json"),
          ]
          for path in paths:
              value = json.loads(path.read_text())
              print(f"json ok: {path}")
              if path.name == "postgres-source-connector.json":
                  assert "connector.class" in value
                  assert "name" not in value and "config" not in value
          PY
      - name: Validate shell scripts
        run: >-
          docker run --rm -v "$PWD:/mnt:ro" koalaman/shellcheck-alpine:v0.10.0
          sh -c 'find /mnt -type f -name "*.sh" -not -path "/mnt/.git/*" -print0 |
          xargs -0 shellcheck'
      - name: Validate GitHub Actions workflow
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.7
      - name: Validate Markdown links
        run: python3 scripts/validate_markdown_links.py
      - name: Render every Kubernetes kustomization
        run: make validate-k8s

  compose-e2e-smoke:
    name: compose-e2e-smoke (${{ matrix.mode }})
    runs-on: ubuntu-latest
    needs:
      - flink-job-test
      - docker-compose-config
      - python-and-k8s-static
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: at-least-once
            target: ci-smoke
          - mode: exactly-once
            target: ci-smoke-exactly-once
    steps:
      - uses: actions/checkout@v7
      - name: Show Docker versions
        run: |
          docker version
          docker compose version
      - name: Run Docker Compose E2E smoke test
        env:
          CI_GENERATOR_RUN_SECONDS: "80"
          CI_GENERATOR_EVENTS_PER_SECOND: "40"
          SMOKE_TOPIC_ATTEMPTS: "35"
        run: make ${{ matrix.target }}

  cdc-connector-smoke:
    runs-on: ubuntu-latest
    needs:
      - docker-compose-config
      - python-and-k8s-static
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Verify CDC insert and delete events
        env:
          CDC_SMOKE_ATTEMPTS: "30"
        run: make cdc-smoke
      - name: Clean up CDC stack
        if: always()
        run: docker compose --profile cdc down -v --remove-orphans
